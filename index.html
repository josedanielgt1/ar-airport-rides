<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Premium private rides across Austin & Central Texas. 24/7 reservations." />
    <title>AR Airport Rides</title>

    <script>
      // Antes del primer pintado: marca JS activo y decide si hay movimiento o modo quieto
      // (reduced-motion o ahorro de datos). Sin JS, todo el contenido queda visible.
      (function () {
        var d = document.documentElement;
        var still = false;
        try {
          still =
            window.matchMedia('(prefers-reduced-motion: reduce)').matches ||
            !!(navigator.connection && navigator.connection.saveData);
        } catch (e) {}
        d.classList.add('js', still ? 'still' : 'motion');
      })();
    </script>

    <link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header class="site-header">
      <!-- TODO(cliente): reemplazar el wordmark por el monograma AR en SVG cuando llegue el archivo. -->
      <a class="brand" href="#top" aria-label="AR Airport Rides">
        <span class="brand__mark" aria-hidden="true">AR</span>
        <span class="brand__name" aria-hidden="true">Airport Rides</span>
      </a>

      <div class="lang" role="group" aria-label="Language" data-i18n-attr="aria-label:lang.label">
        <button class="lang__btn" type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
        <span class="lang__sep" aria-hidden="true"></span>
        <button class="lang__btn" type="button" data-lang="es" aria-pressed="false" lang="es">ES</button>
      </div>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__media">
          <video
            class="hero__video"
            muted
            playsinline
            preload="none"
            poster="/media/poster.jpg"
            width="1280"
            height="960"
            aria-hidden="true"
            tabindex="-1"
            disablepictureinpicture
            disableremoteplayback
          ></video>
          <script>
            // Modo quieto: mostrar la composición final en vez del primer frame.
            if (document.documentElement.classList.contains('still')) {
              document.currentScript.previousElementSibling.poster = 'media/hero-last.jpg'; // relativo: sirve en / y en /ar-airport-rides/
            }
          </script>
        </div>

        <div class="hero__copy">
          <h1 class="hero__title" id="hero-title">Arrive refreshed. <br />On time. <br />Every time.</h1>
          <p class="hero__sub" data-i18n="hero.sub">Premium private rides across Austin &amp; Central Texas.</p>
        </div>
      </section>
    </main>

    <!-- TODO(cliente): número de WhatsApp provisional (= teléfono 737-529-1720). Confirmar. -->
    <a
      class="wa-fab"
      href="https://wa.me/17375291720?text=Hi!%20I%27d%20like%20to%20book%20a%20ride%20with%20AR%20Airport%20Rides."
      target="_blank"
      rel="noopener"
    >
      <svg class="wa-fab__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="currentColor"
          d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2Zm0 18.15h-.01a8.23 8.23 0 0 1-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.26-8.24a8.24 8.24 0 0 1 8.24 8.25c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.7-.8-.22-.09-.39-.13-.55.12-.17.25-.64.8-.78.97-.15.16-.29.18-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.16.04-.31-.02-.43-.06-.12-.55-1.34-.76-1.83-.2-.48-.4-.42-.55-.42h-.47a.9.9 0 0 0-.66.31c-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.1-.23-.16-.48-.29Z"

      <span data-i18n="wa.cta">Reserve on WhatsApp</span>
    </a>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
